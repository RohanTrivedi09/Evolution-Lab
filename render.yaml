# Render blueprint for the API. The free plan sleeps after ~15 minutes idle and takes
# about a minute to wake; runs and pasted datasets are held in memory, so they do not
# survive that restart (see README, Known limitations).
services:
  - type: web
    name: evolution-lab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
